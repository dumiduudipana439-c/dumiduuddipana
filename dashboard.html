<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dashboard | DumiduUddipana</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

  <a href="index.html" class="logo">

    <span class="logo-box">DU</span>

    <span>DumiduUddipana</span>

  </a>


  <nav>

    <a href="courses.html">
      Courses
    </a>

    <a href="progress.html">
      Progress
    </a>

    <a href="certificate.html">
      Certificate
    </a>

  </nav>

</header>


<section class="dashboard">

  <div class="dashboard-header">

    <div>

      <div class="eyebrow">
        STUDENT DASHBOARD
      </div>

      <h1>
        Welcome 👋
      </h1>

      <p>
        Continue your learning journey.
      </p>

    </div>


    <a
      href="courses.html"
      class="btn primary">

      Browse Courses

    </a>

  </div>


  <div class="dashboard-grid">

    <div class="dashboard-card">

      <span>📚</span>

      <strong>1</strong>

      <p>
        Courses Enrolled
      </p>

    </div>


    <div class="dashboard-card">

      <span>🎬</span>

      <strong>5</strong>

      <p>
        Lessons Completed
      </p>

    </div>


    <div class="dashboard-card">

      <span>🏆</span>

      <strong>0</strong>

      <p>
        Certificates
      </p>

    </div>

  </div>


  <div class="learning-card">

    <div>

      <span class="tag">
        IN PROGRESS
      </span>

      <h2>
        AI Video Creation
      </h2>

      <p>
        5 of 12 lessons completed
      </p>

    </div>


    <a
      href="progress.html"
      class="btn primary">

      Continue →

    </a>

  </div>

</section>


</body>

</html>
