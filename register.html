<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Account | DumiduUddipana</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="auth-page">

  <div class="auth-box">

    <a href="index.html" class="logo">

      <span class="logo-box">DU</span>

      <span>DumiduUddipana</span>

    </a>


    <h1>
      Create Account
    </h1>

    <p>
      Start your learning journey.
    </p>


    <form onsubmit="demoRegister(event)">

      <label>
        Full Name
      </label>

      <input
        type="text"
        id="registerName"
        placeholder="Your name"
        required>


      <label>
        Email
      </label>

      <input
        type="email"
        id="registerEmail"
        placeholder="you@example.com"
        required>


      <label>
        Password
      </label>

      <input
        type="password"
        placeholder="Create a password"
        required>


      <button
        type="submit"
        class="btn primary">

        Create Account

      </button>

    </form>


    <p>
      Already have an account?
      <a href="login.html">
        Login
      </a>
    </p>

  </div>

</div>


<script src="script.js"></script>

</body>

</html>
