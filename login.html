<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | DumiduUddipana</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="auth-page">

  <div class="auth-box">

    <a href="index.html" class="logo">

      <span class="logo-box">DU</span>

      <span>DumiduUddipana</span>

    </a>


    <h1>
      Welcome Back
    </h1>

    <p>
      Login to access your dashboard.
    </p>


    <form onsubmit="demoLogin(event)">

      <label>
        Email
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="you@example.com"
        required>


      <label>
        Password
      </label>

      <input
        type="password"
        placeholder="Your password"
        required>


      <button
        type="submit"
        class="btn primary">

        Login

      </button>

    </form>


    <p>
      Don't have an account?
      <a href="register.html">
        Create one
      </a>
    </p>

  </div>

</div>


<script src="script.js"></script>

</body>

</html>
