<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Login to your DumiduUddipana account.">

  <title>Login | DumiduUddipana</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-box">

    <a href="index.html" class="logo">
      <span class="logo-box">DU</span>
      <span>DumiduUddipana</span>
    </a>

    <h1>Welcome back</h1>

    <p>
      Login to continue learning.
    </p>

    <form id="loginForm">

      <label for="loginEmail">
        Email Address
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="you@example.com"
        required
      >

      <label for="loginPassword">
        Password
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Your password"
        required
      >

      <button type="submit" class="btn primary">
        Login
      </button>

    </form>

    <p id="loginMessage"></p>

    <p>
      Don't have an account?
      <a href="register.html">Create Account</a>
    </p>

    <p>
      <a href="index.html">← Back to Home</a>
    </p>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
