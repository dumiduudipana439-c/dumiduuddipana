<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Login to your DumiduUddipana account."
  >

  <title>Login | DumiduUddipana</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<div class="auth-page">

  <div class="auth-box">


    <!-- LOGO -->

    <a
      href="index.html"
      class="logo"
    >

      <span class="logo-box">
        DU
      </span>

      <span>
        DumiduUddipana
      </span>

    </a>


    <!-- TITLE -->

    <h1>
      Welcome back
    </h1>


    <p>
      Login to continue learning.
    </p>


    <!-- LOGIN FORM -->

    <form
      id="loginForm"
    >


      <!-- EMAIL -->

      <label for="loginEmail">
        Email Address
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >


      <!-- PASSWORD -->

      <label for="loginPassword">
        Password
      </label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Your password"
        autocomplete="current-password"
        required
      >


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="btn primary"
      >

        Login

      </button>


    </form>


    <!-- LOGIN MESSAGE -->

    <p
      id="loginMessage"
      aria-live="polite"
    ></p>


    <!-- REGISTER -->

    <p>

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

    </p>


    <!-- HOME -->

    <p>

      <a href="index.html">
        ← Back to Home
      </a>

    </p>


  </div>

</div>


<!-- SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- YOUR JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
